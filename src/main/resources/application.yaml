spring:
  application:
    name: finch

  # 접속 정보는 환경변수로 주입받는다.
  #   로컬  — TestFinchApplication(./gradlew bootTestRun)이 Testcontainers 로 띄운 컨테이너가
  #           @ServiceConnection 으로 자동 연결되므로 아래 값은 읽히지 않는다.
  #           직접 띄운 DB 에 붙일 때만 쓰인다.
  #   운영  — k8s Secret(postgres-secret)이 POSTGRES_* 를 컨테이너 환경변수로 주입한다.
  #           Service 이름이 호스트가 되므로 POSTGRES_HOST=postgres, REDIS_HOST=redis.
  #
  # password 에만 기본값을 두지 않는다. 비밀값에 기본값을 두면 주입이 누락됐을 때
  # 조용히 그 값으로 접속을 시도해 원인이 DB 문제처럼 보인다.
  # 기본값이 없으면 누락된 환경변수 이름을 그대로 알려주며 기동에 실패한다.
  # 앞으로 추가할 비밀값(JWT 서명 키, 카카오 시크릿, KIS 키 등)도 같은 규칙을 따른다.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finch_db}
    username: ${POSTGRES_USER:finch}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # 스키마 변경은 Flyway 전용. update 를 쓰면 Flyway 이력과 실제 스키마가 갈라진다 (infraSpec §3.2)
      ddl-auto: validate
    # Entity 를 Controller 밖으로 내보내지 않는다는 계층 규칙과 짝을 이룬다 (backConvention §4)
    open-in-view: false

  # V1__init.sql 이 MVP 스키마 11개 테이블을 만든다 (erd.md §2 전사).
  # 적용이 끝난 마이그레이션 파일은 고치지 않는다. Flyway 가 적용 시점 체크섬을 flyway_schema_history 에
  # 남기고 매 기동마다 대조하므로, 파일이 바뀌면 이미 적용한 사람과 배포에서만 기동이 거부된다.
  # 스키마 변경은 V2 이상을 새로 추가한다.
  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  lifecycle:
    timeout-per-shutdown-phase: 20s

# 자체 발급 JWT 의 서명 키. 이 값을 아는 사람은 아무 사용자로든 로그인하는 토큰을 만들 수 있다.
# HS256 이므로 UTF-8 32바이트(256비트) 이상이어야 하고, 짧으면 기동 시점에 WeakKeyException 으로 거부된다.
jwt:
  secret: ${JWT_SECRET}

# 카카오 OAuth. client-id 는 REST API 키다 (JavaScript 키가 아니다).
# 프론트의 VITE_KAKAO_REST_API_KEY 와 같은 값이어야 인가 코드와 토큰 교환의 앱이 일치한다.
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  # 콘솔에서 Client Secret 을 켜지 않은 앱은 이 값이 없다. 그때는 빈 문자열로 두면
  # 토큰 교환 폼에서 client_secret 파라미터 자체가 빠진다 (KakaoOAuthClient.tokenForm).
  # 변수 자체는 필수로 둔다 — 기본값을 주면 켜 놓고 주입을 빠뜨린 경우가 조용히 지나간다.
  client-secret: ${KAKAO_CLIENT_SECRET}

server:
  # 무중단 롤링 배포의 전제. 종료 신호를 받아도 처리 중인 요청을 끝내고 내려간다 (infraSpec §5.2)
  shutdown: graceful
  # Cloudflare Tunnel/Ingress 뒤에서도 Swagger 가 외부 HTTPS 주소를 올바르게 만든다.
  forward-headers-strategy: framework

springdoc:
  # AI 서버 전용 /internal/v1/** 는 공개 계약에서 제외한다.
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        # prometheus 는 Prometheus scrape 대상이다. 빼면 모니터링이 성립하지 않는다 (infraSpec §6.1)
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/readiness · liveness 를 연다. k8s 프로브가 이 경로를 쓴다 (infraSpec §5.2)
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        # Boot 4 는 메트릭 export 가 기본 비활성이다(management.defaults.metrics.export.enabled=false).
        # 켜지 않으면 exposure 에 prometheus 를 넣어도 엔드포인트 자체가 만들어지지 않아 404 가 나고,
        # Prometheus 는 에러 없이 빈 스크레이프만 계속한다 (infraSpec §6.1)
        enabled: true

# 우리가 정한 값은 전부 finch.* 아래 둔다 (FinchProperties 주석).
finch:
  auth:
    test-login:
      # 카카오 없이 고정 테스트 계정 1로 로그인하는 임시 입구 (apiSpec 2.5). 기본은 꺼짐 — 꺼져 있으면 경로가 없다(404).
      # 켤 때는 환경변수로만 준다: FINCH_AUTH_TESTLOGIN_ENABLED=true, FINCH_AUTH_TESTLOGIN_KEY=<16자 이상 비밀값>.
      # 여기에 ${...} 자리표시자를 두지 않는다 — 운영이 "주지 않는 것" 이 기본이라 환경변수 계약 검사가 누락으로 잡는다
      # (infra/scripts/check-env-contract.py). 스프링은 위 두 이름을 자리표시자 없이도 이 설정에 묶는다.
      # 키 없이 켜면 기동에 실패한다 (TestLoginService). 발표·평가가 끝나면 끄고 코드를 지운다.
      enabled: false

  account:
    # 계좌 개설 시 지급하는 예수금 (featureSpec 2.2).
    #
    # 0 이다 — 실제 증권 서비스가 가입만으로 돈을 주지 않으므로 사용자는 충전부터 하고 시작한다.
    # 0 이면 INITIAL_GRANT 원장 행도 남기지 않는다. cash_delta 가 0 인 행은 기록할 사건이 없는 것이라
    # 회차 전환 기록을 없앤 것과 같은 이유다 (erd.md §2.3).
    #
    # 값을 지우지 않고 0 으로 둔 이유 — 지급 여부는 정책이지 구현이 아니다. 시연에서 잔고가 있는
    # 상태로 시작하려면 이 값만 올리면 되고, 그때 원장 기록도 함께 돌아온다.
    #
    # 이 값을 바꿔도 이미 개설된 계좌는 그대로다 — 원장이 지급 시점 금액을 들고 있어서
    # 과거를 다시 계산할 필요가 없다.
    initial-cash: 0

  deposit:
    # 충전 한도 (apiSpec 4.1·4.2). 두 값은 DB CHECK(ck_payment_amount·ck_account_deposited)와 같아야 한다 —
    # 여기만 올리면 INSERT 가 제약 위반으로 실패한다. 바꿀 때는 마이그레이션이 먼저다.
    per-request-limit: 10000000
    cumulative-limit: 100000000
    # 결제창으로 갔다가 돌아오지 않은 READY 건이 만료되기까지. 응답의 expiresAt 이 이 값이고,
    # 지난 건은 하루 1회 배치(PaymentExpiryScheduler)가 FAILED(EXPIRED) 로 정리한다.
    ready-ttl: 15m
    # 우리 서버의 외부 주소. 카카오가 사용자의 브라우저를 되돌려 보낼 승인 콜백 URL 을 이 값으로 만든다.
    # 카카오페이 콘솔(developers.kakaopay.com)에 이 도메인이 등록돼 있어야 결제창이 뜬다.
    public-base-url: ${FINCH_PUBLIC_BASE_URL:http://localhost:8080}
    # 프론트 주소. 결제가 끝난 사용자를 보낼 화면과 모의 이체 화면이 여기 있다.
    # 배포는 nginx 가 같은 오리진으로 붙이므로 운영에서는 public-base-url 과 같은 값이다. 로컬은 Vite dev 서버다.
    front-base-url: ${FINCH_FRONT_BASE_URL:http://localhost:5173}
    # 아래 세 경로는 프론트 라우트다. 프론트가 화면을 만들면서 이름을 정하면 여기만 맞춘다 (apiSpec 4.2·4.3.1).
    success-path: /deposit/complete
    fail-path: /deposit/fail
    transfer-checkout-path: /deposit/transfer
    kakaopay:
      # false 면 카카오를 치지 않고 MockTransferGateway 가 KAKAOPAY 도 맡는다. 키 없는 환경(테스트·CI)용이고
      # 테스트 설정(src/test/resources/config)이 false 로 덮는다. 운영은 true 다.
      enabled: true
      # dev/prod Secret Key. 비밀값이라 기본값이 없다 — 누락되면 기동에 실패해 바로 드러난다.
      secret-key: ${KAKAOPAY_SECRET_KEY}
      # 카카오가 제공하는 테스트 가맹점 코드. 결제창·승인 흐름은 진짜지만 실제 금전 이동이 없다.
      cid: TC0ONETIME
      base-url: https://open-api.kakaopay.com
      # 응답 대기 제한. 사용자가 결제창 URL 을 기다리고 있는 호출이라 길게 잡을 이유가 없다.
      timeout: 10s

  # 서비스 종목 범위 (이슈 #253). 켜면 이 목록 밖의 종목은 서비스에 없는 종목이다 — 검색에서 빠지고, 상세·시세·주문·관심 등록은
  # STOCK_NOT_FOUND 이고, AI 종목 분석 중계도 AI 서버까지 가지 않는다(GMS 크레딧). 종목 마스터는 전 종목 그대로 적재한다.
  # 같은 목록을 finch.kis.realtime.codes 가 앵커(*universe-codes)로 그대로 쓴다 — 실시간으로 받는 종목 = 서비스 종목이다.
  # 테스트 설정이 enabled 를 false 로 덮는다 (시드 300종목을 전제로 한 테스트가 많다).
  universe:
    enabled: true
    # 2026-09-14 확정, 30개. 시드 마스터(상위 300)에 없어 외부에서 확인한 코드는 * 표시 — 운영에서 웹소켓 등록 30건 성공으로 유효 확인.
    # ETF 는 없다 — KRX 애프터마켓(16:00~20:00)이 ETF 를 거래하지 않아 KODEX 두 종목을 넥스틸·흥구석유로 바꿨다.
    codes: &universe-codes
      - "005930"   # 삼성전자
      - "000660"   # SK하이닉스
      - "005380"   # 현대차
      - "009150"   # 삼성전기
      - "092790"   # 넥스틸 *
      - "034020"   # 두산에너빌리티
      - "024060"   # 흥구석유 *
      - "042700"   # 한미반도체
      - "066570"   # LG전자
      - "035420"   # NAVER
      - "035720"   # 카카오
      - "017670"   # SK텔레콤
      - "108490"   # 로보티즈
      - "003490"   # 대한항공
      - "047040"   # 대우건설 *
      - "042660"   # 한화오션 *
      - "006400"   # 삼성SDI
      - "086520"   # 에코프로
      - "006800"   # 미래에셋증권 *
      - "011070"   # LG이노텍
      - "196170"   # 알테오젠
      - "009830"   # 한화솔루션
      - "064400"   # LG씨엔에스
      - "466100"   # 클로봇 *
      - "307950"   # 현대오토에버
      - "267260"   # HD현대일렉트릭 *
      - "006360"   # GS건설 *
      - "062040"   # 산일전기
      - "058610"   # 에스피지
      - "047810"   # 한국항공우주 *

  stock:
    master:
      # kis: KIS 종목 마스터 파일(kospi_code.mst.zip·kosdaq_code.mst.zip)을 내려받아 적재한다. 무인증 정적 파일이라
      #      앱키가 필요 없다 (KIS 실공급자 S10 과 무관). 다운로드·파싱이 실패하면 WARN 을 남기고 csv 로 폴백한다.
      # csv: resources/stock/seed.csv (상위 300 종목) 만 쓴다. 테스트·오프라인용이고 테스트 설정이 이 값으로 덮는다.
      source: kis
      base-url: https://new.real.download.dws.co.kr/common/master
      timeout: 30s
      # 기동 시 stock 테이블이 비어 있으면 1회 적재. 비어 있지 않으면 아래 스케줄에 맡긴다.
      sync-on-startup: true
      # 매일 07:00 KST — 장 시작 전이고 전일 상장·폐지가 마스터에 반영된 뒤다. 두 인스턴스가 같이 돌아도 같은 UPSERT 라 리더 락이 없다.
      cron: "0 0 7 * * *"
    # daily_candle 이 비어 있으면 resources/stock/candles-seed.csv (5종목 250 영업일, 실제 시세가 아닌 랜덤워크) 를 넣는다.
    # 프론트가 차트를 바로 그리게 하는 시연용이다. 운영(prod 프로파일)은 false 다 — KIS 실데이터(lazy 적재·일일 배치)가 채운다.
    seed-on-empty: true
    candle:
      # 봉이 없는 종목을 처음 볼 때 받아 오는 기간 (CandleSyncService lazy 적재). 3년 = 차트의 가장 긴 탭(period=3Y).
      # 월봉 때문에 1년에서 늘렸다 — 1년치를 달로 묶으면 봉이 12개뿐이라 차트가 성립하지 않는다 (apiSpec 5.3, 이슈 #37).
      # 비용은 첫 조회 1회의 KIS 왕복이다. 한 번에 100봉이라 3년(약 750 영업일)은 종목당 8회이고, 그 뒤로는 일일 배치가 1건씩 더한다.
      backfill-days: 1095
      # 일일 갱신. 20:30 KST — KRX 애프터마켓(16:00~20:00, 2026-09-14 도입)까지 끝나야 당일 봉의 종가·거래량이 확정된다. 16:00 에 돌면
      # 그 뒤 4시간 체결이 빠진 봉이 굳는다(한 번 저장된 날은 다시 받지 않는다). 리더만 돈다. provider=fake 면 원천이 비어 아무것도 더하지 않는다.
      cron: "0 30 20 * * *"
      # 기동 시 서비스 종목(finch.universe)의 과거 봉을 미리 채운다. 없으면 사용자가 차트를 처음 열 때 그 자리에서 8회 호출(3년치)을
      # 기다린다. 봉이 이미 있는 종목은 건너뛰므로 첫 배포 때 한 번(30종목 × 8회 ≈ 2분)이고 그 뒤 재시작은 0 이다. 리더만, 배경 스레드에서.
      warm-up-on-startup: true

  price:
    # fake: 랜덤워크로 관심 종목 시세를 만든다 (S7). kis: 실공급자 (S10, 앱키 필요).
    # 소비 측 코드는 이 값을 모른다 — 캐시만 읽기 때문이다.
    provider: fake
    # 마지막 수신에서 이 시간이 지나면 stale: true 다 (apiSpec 5.4). S0-3 가정값이고, 관계식 3 에 따라
    # KIS 순회 주기(3초)보다 커야 한다 — 짧으면 폴링 티어가 상시 "시세 지연" 으로 표시된다.
    stale-after: 10s
    # 관심 신호의 수명 (apiSpec 5.6 폴링 티어 TTL). 이 시간 안에 다시 묻지 않으면 공급자가 그 종목을 더 채우지 않는다.
    # 관계식 1 — 프론트 폴링 주기(권장 3~5초)의 4~6배라야 슬롯이 붙었다 떨어졌다 하지 않는다.
    interest-ttl: 30s
    fake:
      # 기동과 함께 틱을 돌린다. 테스트 설정이 false 로 덮고 tick() 을 직접 부른다 —
      # 배경 스레드가 매초 캐시를 흔들면 stale 판정처럼 시각에 기대는 테스트가 불안정해진다.
      auto-start: true
      tick-interval: 1s
      # 처음 보는 종목의 시작 가격이자 그 종목의 기준가. 전일 종가를 읽지 않는다 —
      # price(1층)가 stock(1층)을 참조하는 것은 같은 층 참조다 (FakePriceFeed 주석).
      base-price: 50000
      max-move-rate: 0.005
      min-price: 100
    index:
      # 시장 지수(KOSPI·KOSDAQ, apiSpec 5.7). 관심 신호와 무관하게 공급자가 이 주기로 두 지수를 채운다 — KIS 호출은 주기당 2회다.
      poll-interval: 10s
      # 지수의 stale 판정 시간. poll-interval 보다 길어야 한다 — 종목 시세의 관계식 3 과 같은 이유다.
      stale-after: 60s

  kis:
    # KIS 실공급자 (S10). finch.price.provider=kis 일 때만 쓰인다.
    # 실전 https://openapi.koreainvestment.com:9443 · 모의 https://openapivts.koreainvestment.com:29443
    base-url: https://openapi.koreainvestment.com:9443
    # 앱키 풀. KIS 의 초당 호출 한도와 실시간 등록 한도는 앱키(계정) 단위라 항목을 더하면 수용량이 그만큼 는다
    # (apiSpec 5.6 관계식 4). 지금은 1개로 운영한다. 부족하면 아래에 항목을 추가하고 새 시크릿(KIS_APP_KEY_2 …)을
    # Jenkins finch-env 와 k8s Secret 에 넣는다 — 코드 변경 없음. label 은 로그·메트릭·Redis 키에 쓰는 이름이고 앱키 원문은
    # 어디에도 찍히지 않는다. 팀원 키를 넣는 것은 그 사람 계정으로 호출하는 것이라 팀 합의가 먼저다.
    #
    # 비밀값이라 기본값이 없다 — provider=fake 인 로컬도 값은 있어야 기동한다(테스트 설정이 가짜 값으로 덮는다).
    keys:
      - app-key: ${KIS_APP_KEY}
        app-secret: ${KIS_APP_SECRET}
        label: primary
    # 관심 종목 한 바퀴 뒤 쉬는 시간 (scheduleWithFixedDelay). 속도는 아래 리미터가 잡으므로 길게 쉴 이유가 없다 — 3초에서 1초로
    # 내려 6종목 이하에서 갱신 주기를 약 6초 → 3~4초로. stale-after(10초)보다 짧아야 한다 — apiSpec 5.6 관계식 3.
    poll-interval: 1s
    # 키당 초당 호출 상한. 2026-09-14 실측: 운영 앱키는 모의투자 계좌라 KIS 가 2건/초에서 EGW00201 로 거부한다 (실전 도메인 9443 에서
    # 조회해도 모의 기준). 20 으로 두면 리미터가 아무것도 막지 않아 호출의 3분의 1이 거부·재시도로 낭비됐다. 실전 키로 바꾸면 20.
    # 수용량 = 키 수 × 이 값 × 순회 시간. 서비스 종목 30개는 웹소켓이 맡으므로 폴링은 지수·초기값·일봉 백필이 주 고객이다.
    rate-per-second: 2
    timeout: 5s
    # 접근토큰(24시간)을 만료 이 시간 전에 버린다. 재발급은 키당 분당 1회로 제한돼 있어 Redis 에 두고 인스턴스가 나눠 쓴다.
    token-refresh-margin: 5m
    # 기동과 함께 폴링·실시간을 돌린다. 테스트 설정이 false 로 덮는다.
    auto-start: true
    # 웹소켓 실시간 티어 (S12, 이슈 #253). 켜면 리더가 세션 하나를 열어 아래 종목을 체결가(H0STCNT0)로 고정 등록하고, 체결이 올 때마다
    # 캐시를 채운다. 그동안 폴링은 이 종목을 건너뛰고, 세션이 끊기면 다시 맡는다. 등록은 세션당 41건이 상한이라 종목은 41개까지다.
    # 프론트 계약은 바뀌지 않는다 — 같은 캐시를 읽고 asOf 만 체결 시각에 가까워진다.
    realtime:
      # 기본은 끈다. 운영 프로파일이 켠다 (아래 on-profile: prod).
      enabled: false
      # 실전 ws://ops.koreainvestment.com:21000 · 모의 ws://ops.koreainvestment.com:31000. base-url 의 키 종류와 맞춘다.
      url: ws://ops.koreainvestment.com:21000
      # 끊기거나 접속에 실패한 뒤 재시도까지. 짧으면 KIS 가 막힌 상태에서 연속 접속으로 더 맞는다.
      reconnect-delay: 5s
      # 고정 등록 종목 = 서비스 종목 범위 (finch.universe.codes 의 앵커). 목록은 한 곳(universe)에만 적는다 — 두 목록이 어긋나면
      # 서비스엔 있는데 실시간이 아닌 종목이 생긴다. 41건(세션 한도)을 넘기면 기동에 실패한다.
      codes: *universe-codes

  market:
    # 장 시간(평일 09:00~15:30·16:00~20:00 KST) 밖에서도 장이 열린 것으로 본다. 시연·테스트 전용이라 운영은 false 다.
    # 발표(9/28)는 장 마감 뒤일 수 있고, 그때 주문이 전부 ORDER_MARKET_CLOSED 로 막히면 데모가 성립하지 않는다.
    always-open: false

  ai:
    # AI 서버 (FastAPI). 배포는 compose 서비스 이름, 로컬은 uvicorn 기본 포트. 경로 접두사 /api/ai/v1 은 코드(AiRoute)가 붙인다.
    base-url: ${FINCH_AI_BASE_URL:http://localhost:8000}
    # 백엔드 → AI 방향의 X-Internal-Token. AI 쪽 BACKEND_SERVICE_TOKEN 과 같은 값이어야 한다. 비밀값이라 기본값이 없다.
    internal-token: ${AI_INTERNAL_TOKEN}
    # LLM 을 기다리는 경로의 응답 대기 제한. 타임아웃이 넷 겹쳐 있고 안쪽이 먼저 터져야 한다 (이슈 #87·#90).
    #   AI 동기 POST /chat 55초  <  여기 60초  <  Cloudflare 약 100초
    # 55초보다 먼저 끊으면 AI 가 이미 만든 답을 우리가 버린다(그 호출의 비용은 나간 뒤다). 100초를 넘기면 Cloudflare 가
    # 먼저 끊어 프론트가 우리 JSON 봉투가 아니라 HTML 504 를 받는다 — #87 이 그것이었고, 90초는 그 사이가 10초뿐이라
    # 왕복에 먹혔다. 위아래 두 값 중 하나가 바뀌면 이 값도 함께 바뀐다.
    timeout: 60s
    # LLM 을 기다리지 않는 경로(AiRoute.quick — 채팅 작업 생성·조회)의 대기 제한. 하나는 작업을 적고 202 로 곧장
    # 돌아오고 하나는 테이블을 한 번 읽는다. 여기에 분 단위를 주면 AI 가 멈췄을 때 2초마다 오는 폴링이 전부 그만큼
    # 서블릿 스레드에 쌓인다.
    quick-timeout: 10s

  internal:
    # /internal/v1 (AI 서버 전용, apiSpec 9장) 의 X-Internal-Token 과 대조할 값. AI 쪽 BACKEND_SERVICE_TOKEN 과 같은 값이어야 한다.
    # 백엔드 → AI 방향(finch.ai.internal-token)과 별도 변수다 — 한쪽이 유출되면 한쪽만 바꾼다. 비밀값이라 기본값이 없다.
    token: ${BACKEND_INTERNAL_TOKEN}

  leader-lock:
    # replica 중 1대만 KIS 폴링·일봉 배치를 돌린다 (global/lock/LeaderLock). 리더가 죽으면 ttl 뒤에 다른 인스턴스가 이어받고,
    # 살아 있는 리더는 renew-interval 마다 ttl 을 늘린다. renew-interval 은 ttl 보다 충분히 짧아야 한다.
    ttl: 10s
    renew-interval: 3s

  http:
    # 외부 API(카카오·KIS·AI) 연결까지의 제한. 응답 대기 시간은 호출하는 쪽이 각자 정한다 (FinchProperties.Http).
    connect-timeout: 3s
    # 유휴 연결 폐기까지의 시간. 상대 서버의 keep-alive 보다 짧아야 한다 — AI 의 uvicorn 이 기본 5초다.
    # 길면 상대가 이미 닫은 연결을 풀에서 꺼내 쓰고 'Connection prematurely closed' 로 실패한다 (이슈 207).
    max-idle-time: 2s
    evict-interval: 30s

  idempotency:
    # Idempotency-Key 를 요구할 경로. 여기 없는 경로는 필터를 타지 않는다.
    # apiSpec 1.4·4.5·7.1·11.1·12(v0.8) 가 이 둘을 멱등성 필수로 적고 있고, 이 목록이 그 계약의 구현이다.
    # 둘 중 하나를 빼면 그 엔드포인트는 조용히 멱등성 없이 열린다 — IdempotencyPropertiesTest 가 막는다.
    #
    # 충전(/deposits/**)은 여기 없다. v0.8 에서 충전이 ready/confirm 2단계가 되면서 멱등 기준이 클라이언트 UUID 가
    # 아니라 PG 가 발급한 paymentKey 로 바뀌었다 (apiSpec 1.4). 여기 넣으면 ready 가 헤더 없음 400 으로 막힌다.
    # 출금(/withdrawals)은 PG 가 없어 키를 발급할 주체가 없으므로 클라이언트 UUID 로 돌아간다 — WithdrawalService 의
    # 재전송 방어는 이 한 줄이 전부다. 서비스는 재생 경로를 갖지 않는다.
    #
    # AI 채팅 작업 생성(/api/v1/ai/chat/jobs)은 v0.8.19 에서 들어왔다 (이슈 #84·#90). 중계 경로 중 유일하게 여기 오르는데,
    # 부를 때마다 LLM 이 도는 새 작업이 생겨 재전송이 곧 중복 과금이기 때문이다. 재전송은 최초의 202 와 jobId 를
    # 그대로 재생받으므로 프론트는 같은 작업을 계속 폴링한다. AI 쪽에도 같은 키로 2차 방어가 있다 (AI api-spec §4.2).
    # 상태 조회(GET .../jobs/{jobId})는 여기 없다 — 필터가 POST 만 보고, GET 은 여러 번 불러도 같은 결과다.
    paths:
      - /api/v1/orders
      - /api/v1/withdrawals
      - /api/v1/ai/chat/jobs
    # 처리 중 표시의 수명. 짧으면 처리가 끝나기 전에 풀려 같은 요청이 두 번 실행되고,
    # 길면 서버가 죽었을 때 재시도가 그만큼 막힌다.
    in-progress-ttl: 60s
    # 최초 응답을 재생해 주는 기간. 24시간은 apiSpec 1.4 가 확정한 값이다.
    done-ttl: 24h
    # 409 IDEMPOTENCY_IN_PROGRESS 응답의 Retry-After 헤더 값 (apiSpec 1.4).
    # 계약이 "짧게 대기 후 동일 키로 재시도"인데, 그 "짧게"를 클라이언트가 추측하지 않게 서버가 정한다.
    # 주문 트랜잭션은 1초 안에 끝나는 것이 정상이라 1초로 둔다. 초 단위 정수로만 나갈 수 있다(RFC 9110).
    retry-after: 1s

logging:
  pattern:
    # %X{requestId} 는 RequestIdFilter 가 MDC 에 둔 요청 식별자다 (apiSpec 1.1 요청 추적).
    # 이 자리가 없으면 필터가 있어도 로그에는 아무것도 안 붙는다.
    # 기본 패턴에서 바꾼 것은 이 한 토큰뿐이다 — 로컬에서 읽는 형식은 그대로 둔다.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"

---
# 운영 프로파일(SPRING_PROFILES_ACTIVE=prod)에서만 로그를 JSON 한 줄로 찍는다.
# Loki 든 다른 수집기든 문장을 정규식으로 쪼개지 않고 level·requestId 로 바로 거르게 하기 위해서다.
# Boot 3.4+ 내장 기능이라 라이브러리·logback-spring.xml 이 필요 없고, MDC 값은 자동으로 필드가 된다.
# 로컬은 위 문장 형식을 유지한다 — JSON 은 사람이 읽기 불편하다.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
finch:
  price:
    # 운영은 KIS 실공급자다 (backend_story S10 완료 조건 — provider=kis 는 운영 프로파일만). 로컬·테스트는 fake.
    provider: kis
  kis:
    realtime:
      # 운영은 웹소켓 실시간 티어를 켠다 (이슈 #253). 종목 목록은 기본 설정의 codes 를 그대로 쓴다.
      enabled: true
      # 운영 앱키가 모의투자 계좌라 모의 웹소켓 포트다. 실전 키로 바꾸면 21000 으로 함께 바꾼다.
      url: ws://ops.koreainvestment.com:31000
  stock:
    # 실데이터가 채우므로 랜덤워크 시드를 넣지 않는다. 시드가 들어가면 그 5종목은 "봉이 있다"고 판정돼 lazy 적재가 건너뛰고,
    # 일일 배치가 가짜 봉 뒤에 진짜 봉을 이어 붙인다.
    seed-on-empty: false
