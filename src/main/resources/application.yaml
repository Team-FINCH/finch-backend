spring:
  application:
    name: finch

  # 접속 정보는 환경변수로 주입받는다.
  #   로컬  — TestFinchApplication(./gradlew bootTestRun)이 Testcontainers 로 띄운 컨테이너가
  #           @ServiceConnection 으로 자동 연결되므로 아래 값은 읽히지 않는다.
  #           직접 띄운 DB 에 붙일 때만 쓰인다.
  #   운영  — k8s Secret(postgres-secret)이 POSTGRES_* 를 컨테이너 환경변수로 주입한다.
  #           Service 이름이 호스트가 되므로 POSTGRES_HOST=postgres, REDIS_HOST=redis.
  #
  # password 에만 기본값을 두지 않는다. 비밀값에 기본값을 두면 주입이 누락됐을 때
  # 조용히 그 값으로 접속을 시도해 원인이 DB 문제처럼 보인다.
  # 기본값이 없으면 누락된 환경변수 이름을 그대로 알려주며 기동에 실패한다.
  # 앞으로 추가할 비밀값(JWT 서명 키, 카카오 시크릿, KIS 키 등)도 같은 규칙을 따른다.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finch_db}
    username: ${POSTGRES_USER:finch}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # 스키마 변경은 Flyway 전용. update 를 쓰면 Flyway 이력과 실제 스키마가 갈라진다 (infraSpec §3.2)
      ddl-auto: validate
    # Entity 를 Controller 밖으로 내보내지 않는다는 계층 규칙과 짝을 이룬다 (backConvention §4)
    open-in-view: false

  # V1__init.sql 이 MVP 스키마 11개 테이블을 만든다 (erd.md §2 전사).
  # 적용이 끝난 마이그레이션 파일은 고치지 않는다. Flyway 가 적용 시점 체크섬을 flyway_schema_history 에
  # 남기고 매 기동마다 대조하므로, 파일이 바뀌면 이미 적용한 사람과 배포에서만 기동이 거부된다.
  # 스키마 변경은 V2 이상을 새로 추가한다.
  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  lifecycle:
    timeout-per-shutdown-phase: 20s

# 자체 발급 JWT 의 서명 키. 이 값을 아는 사람은 아무 사용자로든 로그인하는 토큰을 만들 수 있다.
# HS256 이므로 UTF-8 32바이트(256비트) 이상이어야 하고, 짧으면 기동 시점에 WeakKeyException 으로 거부된다.
jwt:
  secret: ${JWT_SECRET}

# 카카오 OAuth. client-id 는 REST API 키다 (JavaScript 키가 아니다).
# 프론트의 VITE_KAKAO_REST_API_KEY 와 같은 값이어야 인가 코드와 토큰 교환의 앱이 일치한다.
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  # 콘솔에서 Client Secret 을 켜지 않은 앱은 이 값이 없다. 그때는 빈 문자열로 두면
  # 토큰 교환 폼에서 client_secret 파라미터 자체가 빠진다 (KakaoOAuthClient.tokenForm).
  # 변수 자체는 필수로 둔다 — 기본값을 주면 켜 놓고 주입을 빠뜨린 경우가 조용히 지나간다.
  client-secret: ${KAKAO_CLIENT_SECRET}

server:
  # 무중단 롤링 배포의 전제. 종료 신호를 받아도 처리 중인 요청을 끝내고 내려간다 (infraSpec §5.2)
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # prometheus 는 Prometheus scrape 대상이다. 빼면 모니터링이 성립하지 않는다 (infraSpec §6.1)
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/readiness · liveness 를 연다. k8s 프로브가 이 경로를 쓴다 (infraSpec §5.2)
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        # Boot 4 는 메트릭 export 가 기본 비활성이다(management.defaults.metrics.export.enabled=false).
        # 켜지 않으면 exposure 에 prometheus 를 넣어도 엔드포인트 자체가 만들어지지 않아 404 가 나고,
        # Prometheus 는 에러 없이 빈 스크레이프만 계속한다 (infraSpec §6.1)
        enabled: true

logging:
  pattern:
    # %X{requestId} 는 RequestIdFilter 가 MDC 에 둔 요청 식별자다 (apiSpec 1.1 요청 추적).
    # 이 자리가 없으면 필터가 있어도 로그에는 아무것도 안 붙는다.
    # 기본 패턴에서 바꾼 것은 이 한 토큰뿐이다 — 로컬에서 읽는 형식은 그대로 둔다.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"

---
# 운영 프로파일(SPRING_PROFILES_ACTIVE=prod)에서만 로그를 JSON 한 줄로 찍는다.
# Loki 든 다른 수집기든 문장을 정규식으로 쪼개지 않고 level·requestId 로 바로 거르게 하기 위해서다.
# Boot 3.4+ 내장 기능이라 라이브러리·logback-spring.xml 이 필요 없고, MDC 값은 자동으로 필드가 된다.
# 로컬은 위 문장 형식을 유지한다 — JSON 은 사람이 읽기 불편하다.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
