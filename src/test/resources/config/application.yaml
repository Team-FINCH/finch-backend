# 테스트 전용 값. classpath:/config/ 는 classpath:/ 보다 우선순위가 높고 **대체가 아니라 덮어쓰기**라
# main 의 application.yaml 은 그대로 살아 있다. (여기에 application.yaml 을 두면 main 것이 통째로 가려진다)
#
# 운영에서는 기본값을 두지 않는다는 규칙 때문에 JWT_SECRET·KAKAO_* 가 없으면 컨텍스트가 뜨지 않는다.
# 테스트까지 그 규칙을 적용하면 스프링 컨텍스트를 띄우는 테스트마다 환경변수를 요구하게 되므로
# 여기서만 가짜 값을 준다. 실제 값과 무관하고, 밖으로 나가지 않는다.
jwt:
  # HS256 은 32바이트 이상을 요구한다. 짧으면 WeakKeyException 으로 컨텍스트가 죽는다.
  secret: test-only-secret-key-0123456789-abcdef

kakao:
  client-id: test-client-id
  client-secret: test-client-secret

finch:
  price:
    fake:
      # 배경 스레드가 매초 캐시를 흔들면 stale 판정처럼 시각에 기대는 테스트가 불안정해진다.
      # 테스트는 FakePriceFeed.tick() 을 직접 부른다.
      auto-start: false
  stock:
    master:
      # 테스트는 네트워크를 타지 않는다. seed.csv 300 종목이 기동 시 적재되고 KisMasterFileLoader 빈은 만들어지지 않는다.
      source: csv
    # 일봉 시드도 넣는다 — 캔들 API 테스트가 삼성전자 등 5종목의 봉을 전제한다.
    seed-on-empty: true
  ai:
    # 중계 테스트는 스텁 WebClient 를 쓰므로 주소는 닿지 않는다. 비밀값 필수 규칙 때문에 토큰 값만 둔다.
    internal-token: test-only-ai-token
  internal:
    # /internal/v1 테스트가 이 값을 헤더로 보낸다. 실제 값과 무관하다.
    token: test-only-internal-token
  kis:
    # 비밀값 필수 규칙 때문에 값은 있어야 한다. provider 가 fake 라 KIS 빈은 만들어지지 않고 이 값은 쓰이지 않는다.
    keys:
      - app-key: test-only-kis-app-key
        app-secret: test-only-kis-app-secret
        label: test
    # provider=kis 로 띄우는 테스트가 있어도 배경 폴링은 돌리지 않는다. 테스트는 tick() 을 직접 부른다.
    auto-start: false
  deposit:
    kakaopay:
      # 테스트는 카카오를 치지 않는다. MockTransferGateway 가 KAKAOPAY 도 맡는다 (backend_story S3 완료 조건).
      enabled: false
      # 비밀값 필수 규칙 때문에 값은 있어야 한다. enabled=false 라 쓰이지 않는다.
      secret-key: test-only-kakaopay-secret
